name: Deploy

on:
  workflow_dispatch:
    inputs:
      refresh_screenshots:
        description: Refresh stale and missing screenshots before deploy
        required: false
        default: false
        type: boolean
      screenshot_slugs:
        description: Optional comma-separated API slugs to refresh
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: saxi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCREENSHOT_API_BASE_URL: ${{ secrets.SCREENSHOT_API_BASE_URL }}
      SCREENSHOT_API_TOKEN: ${{ secrets.SCREENSHOT_API_TOKEN }}
      SCREENSHOT_SLUGS: ${{ github.event.inputs.screenshot_slugs || '' }}
      SHOULD_REFRESH_SCREENSHOTS: ${{ github.event_name == 'schedule' || github.event.inputs.refresh_screenshots == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community API submissions
        run: npm run validate:community-apis

      - name: Restore screenshot cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/screenshots
          key: screenshots-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            screenshots-${{ runner.os }}-

      - name: Verify system Chrome for screenshots
        id: system_chrome
        if: env.SHOULD_REFRESH_SCREENSHOTS == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: google-chrome --version

      - name: Refresh screenshots
        if: env.SHOULD_REFRESH_SCREENSHOTS == 'true' && steps.system_chrome.outcome == 'success'
        timeout-minutes: 35
        continue-on-error: true
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          args=(--concurrency=5 --limit=60 --stale-days=90)
          if [ -n "$SCREENSHOT_SLUGS" ]; then
            args+=(--slugs="$SCREENSHOT_SLUGS")
          fi
          npm run screenshots:capture -- "${args[@]}"

      - name: Report screenshot coverage
        if: env.SHOULD_REFRESH_SCREENSHOTS == 'true'
        continue-on-error: true
        run: npm run screenshots:report

      - name: Validate types and Wrangler bindings
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify internal links
        run: npm run verify:links

      - name: Save screenshot cache
        if: always() && env.SHOULD_REFRESH_SCREENSHOTS == 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/screenshots
          key: screenshots-${{ runner.os }}-${{ github.run_id }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
